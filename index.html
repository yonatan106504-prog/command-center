<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חדר פיקוד — סוכנים אישיים</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --primary: #38bdf8; --text: #f1f5f9; --muted: #94a3b8; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
    .panel { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 24px; }
    .agents-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .agent-btn { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.15s; }
    .agent-btn.active { background: var(--primary); color: #0f172a; border-color: var(--primary); }
    textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical; min-height: 80px; margin-bottom: 12px; }
    .btn-run { background: var(--primary); color: #0f172a; border: none; padding: 12px 26px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 12px; font-weight: 600; color: var(--primary); }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-chip { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
    .filter-chip.active { border-color: var(--primary); color: var(--primary); }
    .result-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 16px; }
    .card-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .tag { background: rgba(56, 189, 248, 0.15); color: var(--primary); padding: 2px 10px; border-radius: 6px; font-weight: 600; }
    .task-title { font-weight: 700; margin-bottom: 10px; color: #fff; }
    .output-body { white-space: pre-line; color: #e2e8f0; }
    input[type="password"] { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; width: 280px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>חדר פיקוד — ניהול סוכנים</h1>
    <button class="btn-ghost" onclick="toggleSettings()">⚙️ הגדרות חיבור</button>
  </header>

  <div id="settingsPanel" class="panel" style="display:none;">
    <div style="margin-bottom:8px; font-size:0.9rem; color:var(--muted);">הזן GitHub Fine-Grained Token (נשמר מקומית בדפדפן שלך בלבד):</div>
    <input type="password" id="tokenInput" placeholder="github_pat_...">
    <button class="btn-run" style="padding:10px 18px;" onclick="saveToken()">שמור</button>
  </div>

  <div class="panel">
    <div style="margin-bottom:8px; font-size:0.9rem; color:var(--muted);">1. בחר סוכן להפעלה:</div>
    <div class="agents-grid" id="agentsList"></div>

    <div style="margin-bottom:8px; font-size:0.9rem; color:var(--muted);">2. הגדר משימה לסוכן:</div>
    <textarea id="taskInput" placeholder="הקלד כאן את המשימה או השאלה..."></textarea>
    <button class="btn-run" id="runBtn" onclick="dispatchAgent()">הפעל סוכן</button>
    <div id="status"></div>
  </div>

  <div class="filter-bar" id="filterBar"></div>
  <div id="feed"></div>
</div>

<script>
  const OWNER = "yonatan106504-prog";
  const REPO = "command-center";
  const WORKFLOW = "run_agent.yml";

  // רשימת הסוכנים - להוספת סוכן חדש, הוסף שורה כאן וקובץ תואם בתיקיית agents/
  const AGENTS = [
    { id: "research", label: "🔍 מחקר וניתוח", placeholder: "לדוגמה: סקור את המחלוקת ההלכתית סביב..." },
    { id: "finance", label: "📈 פיננסים ושוק ההון", placeholder: "לדוגמה: נתח את מכפילי הרווח והסיכונים ב-S&P 500 כעת..." }
  ];

  let selectedAgent = AGENTS[0].id;
  let currentFilter = "all";
  let allRecords = [];

  function initUI() {
    const list = document.getElementById("agentsList");
    list.innerHTML = AGENTS.map(a => `
      <button class="agent-btn ${a.id === selectedAgent ? 'active' : ''}" onclick="selectAgent('${a.id}')">${a.label}</button>
    `).join("");

    const filterBar = document.getElementById("filterBar");
    filterBar.innerHTML = `<button class="filter-chip active" onclick="setFilter('all', this)">הכל</button>` +
      AGENTS.map(a => `<button class="filter-chip" onclick="setFilter('${a.id}', this)">${a.label}</button>`).join("");

    updatePlaceholder();
  }

  function selectAgent(id) {
    selectedAgent = id;
    document.querySelectorAll(".agent-btn").forEach((btn, idx) => {
      btn.classList.toggle("active", AGENTS[idx].id === id);
    });
    updatePlaceholder();
  }

  function updatePlaceholder() {
    const agent = AGENTS.find(a => a.id === selectedAgent);
    document.getElementById("taskInput").placeholder = agent ? agent.placeholder : "";
  }

  function setFilter(filterId, el) {
    currentFilter = filterId;
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    renderFeed();
  }

  function toggleSettings() {
    const p = document.getElementById("settingsPanel");
    p.style.display = p.style.display === "none" ? "block" : "none";
    document.getElementById("tokenInput").value = localStorage.getItem("cc_gh_token") || "";
  }

  function saveToken() {
    const val = document.getElementById("tokenInput").value.trim();
    if (val) {
      localStorage.setItem("cc_gh_token", val);
      document.getElementById("settingsPanel").style.display = "none";
    }
  }

  async function loadResults() {
    try {
      const res = await fetch(`data/results.json?t=${Date.now()}`);
      if (!res.ok) return [];
      allRecords = await res.json();
      renderFeed();
      return allRecords;
    } catch { return []; }
  }

  function renderFeed() {
    const feed = document.getElementById("feed");
    const filtered = currentFilter === "all" ? allRecords : allRecords.filter(r => r.agent === currentFilter);
    if (!filtered.length) {
      feed.innerHTML = `<div style="text-align:center; color:var(--muted); padding:20px;">אין עדיין תוצאות להצגה בקטגוריה זו.</div>`;
      return;
    }
    feed.innerHTML = filtered.map(r => `
      <div class="result-card">
        <div class="card-header">
          <span class="tag">${r.agent_label || r.agent}</span>
          <span>${r.timestamp}</span>
        </div>
        <div class="task-title">משימה: ${r.task}</div>
        <div class="output-body">${r.output}</div>
      </div>
    `).join("");
  }

  async function dispatchAgent() {
    const token = localStorage.getItem("cc_gh_token");
    if (!token) {
      toggleSettings();
      alert("הזן תחילה את ה-GitHub Token בהגדרות.");
      return;
    }
    const task = document.getElementById("taskInput").value.trim();
    if (!task) return;

    const btn = document.getElementById("runBtn");
    const status = document.getElementById("status");
    btn.disabled = true;
    status.textContent = "⏳ משגר משימה לסוכן...";

    const initialCount = allRecords.length;

    try {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ ref: "main", inputs: { agent: selectedAgent, task: task } })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "שגיאה בהפעלת הסוכן");
      }

      status.textContent = "⚙️ הסוכן מעבד את המשימה ברקע (כ-15–25 שניות)...";
      let tries = 0;
      const poll = setInterval(async () => {
        tries++;
        const updated = await loadResults();
        if (updated.length > initialCount) {
          clearInterval(poll);
          status.textContent = "✅ התוצאה התקבלה ונשמרה!";
          document.getElementById("taskInput").value = "";
          btn.disabled = false;
        } else if (tries > 24) {
          clearInterval(poll);
          status.textContent = "⚠️ העיבוד מתארך. רענן את הדף בעוד חצי דקה.";
          btn.disabled = false;
        }
      }, 5000);
    } catch (e) {
      status.textContent = `❌ שגיאה: ${e.message}`;
      btn.disabled = false;
    }
  }

  if (!localStorage.getItem("cc_gh_token")) {
    document.getElementById("settingsPanel").style.display = "block";
  }
  initUI();
  loadResults();
</script>
</body>
</html>
